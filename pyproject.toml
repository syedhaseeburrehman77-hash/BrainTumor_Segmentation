[project]
name = "fets2022-flower"
version = "0.1.0"
description = "FeTS 2022 3D MRI federated segmentation with Flower"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flwr[simulation]==1.37.0",
    "torch>=2.1.0",
    "monai>=1.3.0",
    "nibabel>=5.2.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
]

[tool.flwr.app]
publisher = "researcher"

[tool.flwr.app.components]
serverapp = "FL_server:app"
clientapp = "FL_client:app"

[tool.flwr.app.config]
data-root = "C:/Users/syedh/Documents/BraT_Segmentation_FeTs2022/MICCAI_FeTS2022_TrainingData"
partition-csv = "C:/Users/syedh/Documents/BraT_Segmentation_FeTs2022/MICCAI_FeTS2022_TrainingData/partitioning_1.csv"
# Global-test module: reserve this fraction before client training; evaluate it only once at the end.
global-test-fraction = 0.15
output-dir = "artifacts"
num-clients = 23
num-server-rounds = 5
local-epochs = 1
batch-size = 1
learning-rate = 0.0001
fraction-train = 1.0
fraction-evaluate = 1.0
strategy = "fedavg"
proximal-mu = 0.01
server-learning-rate = 1.0
server-momentum = 0.9
fedopt-eta = 0.1
fedopt-tau = 0.001
beta-1 = 0.9
beta-2 = 0.99
qfedavg-q = 0.1
trim-beta = 0.2
# RegSimAgg is opt-in: its temporal damping starts after this server round.
regsimagg-regularization-round = 5
# "paper_l1" compares complete parameter vectors; "github_compat" reproduces the prototype mode.
regsimagg-distance-mode = "paper_l1"
fedindar-base-mu = 0.01
fedindar-alpha = 2.0
fedindar-temporal-beta = 0.5
fedindar-min-mu = 0.001
fedindar-max-mu = 0.1
cache-rate = 0.0
seed = 42
device = "auto"
num-workers = 0
