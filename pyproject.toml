[project]
name = "fets2022-flower"
version = "0.1.0"
description = "FeTS 2022 3D MRI federated segmentation with Flower"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flwr[simulation]>=1.13.0",
    "torch>=2.1.0",
    "monai>=1.3.0",
    "nibabel>=5.2.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
]

[tool.flwr.app]
publisher = "researcher"

[tool.flwr.app.components]
serverapp = "FL_server:app"
clientapp = "FL_client:app"

[tool.flwr.app.config]
data-root = "C:/Users/syedh/Documents/BraT_Segmentation_FeTs2022/MICCAI_FeTS2022_TrainingData"
partition-csv = "C:/Users/syedh/Documents/BraT_Segmentation_FeTs2022/MICCAI_FeTS2022_TrainingData/partitioning_1.csv"
output-dir = "artifacts"
num-clients = 23
num-server-rounds = 5
local-epochs = 1
batch-size = 1
learning-rate = 0.0001
fraction-train = 1.0
fraction-evaluate = 1.0
strategy = "fedavg"
proximal-mu = 0.01
server-learning-rate = 1.0
server-momentum = 0.9
fedopt-tau = 0.001
beta-1 = 0.9
beta-2 = 0.99
qfedavg-q = 0.1
trim-beta = 0.2
cache-rate = 0.0
seed = 42
device = "auto"
num-workers = 0

